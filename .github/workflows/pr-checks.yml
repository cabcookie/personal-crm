name: PR Checks

# Gate for the exact failure class that broke a past production deploy: the
# Amplify build runs `npm ci` (NOT `npm install`), which fails hard when
# package.json and package-lock.json are out of sync, or when a macOS-generated
# lockfile omits a Linux-only optional dependency (e.g. @parcel/watcher). This
# job reproduces that on clean Linux + Node 22 so it surfaces in the PR.
#
# It ALSO runs the frontend TypeScript type-check (`tsc --noEmit`) — the Amplify
# prod build runs this and has broken on it before (tightened a.json() / lodash
# types producing errors that lint alone doesn't catch). `tsc` needs
# `amplify_outputs.json` to resolve the `@/amplify_outputs.json` import in
# lib/amplify.ts; that file is git-ignored and only produced by a backend
# deploy, so CI writes a minimal placeholder (its contents don't matter to the
# type-check — the frontend only passes it to Amplify.configure). The backend
# schema type (`@/amplify/data/resource`) comes from the checked-in source, and
# tsconfig excludes `amplify/`, so no backend deploy / codegen is needed.

on:
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lockfile + lint + type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci` (NOT `npm install`) is what the Amplify build runs. It fails
      # hard when package.json and package-lock.json are out of sync — exactly
      # the discrepancy that only showed up in production before.
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      # Write a minimal placeholder amplify_outputs.json so the
      # `@/amplify_outputs.json` import in lib/amplify.ts resolves. Its contents
      # are irrelevant to the type-check (the frontend only hands it to
      # Amplify.configure); only generate it when a real one isn't present.
      - name: Create placeholder amplify_outputs.json
        run: |
          if [ ! -f amplify_outputs.json ]; then
            cat > amplify_outputs.json <<'JSON'
          {
            "version": "1.5",
            "auth": {
              "user_pool_id": "us-east-1_placeholder",
              "aws_region": "us-east-1",
              "user_pool_client_id": "placeholder",
              "identity_pool_id": "us-east-1:00000000-0000-0000-0000-000000000000"
            },
            "data": {
              "url": "https://placeholder.appsync-api.us-east-1.amazonaws.com/graphql",
              "aws_region": "us-east-1",
              "default_authorization_type": "AMAZON_COGNITO_USER_POOLS",
              "authorization_types": ["AWS_IAM"]
            }
          }
          JSON
          fi

      # The Amplify prod build runs this; keep it in the PR gate so type errors
      # surface here, not in production. tsconfig excludes amplify/, so this is
      # the frontend type-check and needs no backend codegen.
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit -p .
