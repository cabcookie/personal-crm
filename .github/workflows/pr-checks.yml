name: PR Checks

# Gate for the exact failure class that broke a past production deploy: the
# Amplify build runs `npm ci` (NOT `npm install`), which fails hard when
# package.json and package-lock.json are out of sync, or when a macOS-generated
# lockfile omits a Linux-only optional dependency (e.g. @parcel/watcher). This
# job reproduces that on clean Linux + Node 22 so it surfaces in the PR.
#
# Scope is deliberately narrow: `npm ci` (lockfile/platform) + lint. It does NOT
# run `next build` or the Amplify `tsc` type-checks, because those import
# artifacts that only exist after an Amplify backend deploy — amplify_outputs.json
# and the .amplify/generated/env/* modules — which are git-ignored and absent in
# a bare CI checkout. Faking them with placeholders here would add maintenance
# and could mask real type errors; the full type-check/build against the real
# generated schema already runs in the Amplify deploy (and locally).

on:
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lockfile + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci` (NOT `npm install`) is what the Amplify build runs. It fails
      # hard when package.json and package-lock.json are out of sync — exactly
      # the discrepancy that only showed up in production before.
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint
