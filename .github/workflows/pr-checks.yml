name: PR Checks

# Gate that mirrors the Amplify Hosting build environment (Linux + Node 22 +
# `npm ci`) so lockfile/platform/type/lint problems surface in the PR instead
# of only failing the production deploy after merge. Prompted by a deploy that
# passed locally (npm install) but broke in the Amplify build (npm ci): a
# transitive @opentelemetry/core conflict and a missing @parcel/watcher Linux
# binary. Running the exact build steps here catches both classes early.

on:
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lockfile, types, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci` (NOT `npm install`) is what the Amplify build runs. It fails
      # hard when package.json and package-lock.json are out of sync, which is
      # exactly the discrepancy that only showed up in production before.
      - name: Install dependencies (npm ci)
        run: npm ci

      # amplify_outputs.json is generated by the Amplify backend deploy (and is
      # git-ignored), so it does not exist in this CI checkout. tsc / next build
      # import it, so without it the build fails with "Cannot find module
      # '@/amplify_outputs.json'". Amplify Hosting generates the real file at
      # deploy time; here we only need a type-satisfying placeholder so the
      # type-check and build can run. Written only when absent, so it never
      # clobbers a real file. The shape mirrors the fields the app reads
      # (storage.buckets[].{name,bucket_name,aws_region}); the rest is passed
      # opaquely to Amplify.configure.
      - name: Ensure placeholder amplify_outputs.json
        run: >
          node -e "const fs=require('fs');
          if(!fs.existsSync('amplify_outputs.json')){
          fs.writeFileSync('amplify_outputs.json', JSON.stringify({
          version:'1.4', auth:{}, data:{},
          storage:{ aws_region:'us-east-1', bucket_name:'placeholder',
          buckets:[{ name:'recurringExports', bucket_name:'placeholder',
          aws_region:'us-east-1', paths:{} }] } }, null, 2));
          console.log('wrote placeholder amplify_outputs.json'); }
          else { console.log('amplify_outputs.json exists; leaving as-is'); }"

      # Frontend type check (`prebuild`) + Next.js build. On Linux this also
      # exercises the platform-specific optional deps (e.g. @parcel/watcher
      # Linux binary) that a macOS-generated lockfile can omit.
      - name: Build (tsc + next build)
        run: npm run build

      # Backend (Amplify Gen2) type check — mirrors the backend build's
      # compile step without deploying to AWS.
      - name: Backend type check
        run: npx tsc --noEmit -p amplify/tsconfig.json

      - name: Lint
        run: npm run lint
