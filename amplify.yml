version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
        # tsc --noEmit (prebuild) + next build over the full project exceed
        # Node's default ~2 GB heap and OOM-crash the build (exit 134). Raise
        # the heap limit; the Amplify build container has ample RAM.
        - export NODE_OPTIONS=--max-old-space-size=8192
        - npm run build
    postBuild:
      commands:
        # Turbopack (Next 16 default) emits server source maps: 159 files,
        # 140 MB, which alone pushed the deploy bundle over Amplify's 230 MB
        # limit. They are debug artifacts with no runtime role -- dropping
        # them takes .next from 163 MB to 23 MB.
        - find .next -name "*.js.map" -delete
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
