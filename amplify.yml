version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
        - npm run build
    postBuild:
      commands:
        # Turbopack (Next 16 default) leaves a ~220 MB .next/cache, and the
        # artifact glob below packages everything under .next. That pushed the
        # deploy bundle to 280 MB, over Amplify's 230 MB limit. The cache is
        # build-time only and not needed at runtime.
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
